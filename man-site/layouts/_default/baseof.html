<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .Title }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
{{ with .Description }}<meta name="description" content="{{ . }}">
{{ end }}<link rel="canonical" href="{{ .Permalink }}">
<link rel="stylesheet" href="/docs/linux/man/man.css">
</head>
<body>
<main>
<header class="site">
<a class="site-name" href="/">SysTutorials</a>
<nav><a href="/docs/linux/man/">Man Pages</a></nav>
</header>
{{ block "main" . }}{{ end }}
<footer class="site">Linux man pages recovered from the SysTutorials archives.</footer>
</main>
</body>
</html>
