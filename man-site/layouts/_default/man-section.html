{{ define "main" }}
<h1 class="section-title"><a href="/docs/linux/man/">Linux Manual Pages</a> › {{ .Title }}</h1>
{{ $pages := where .Site.RegularPages "Params.section" .Params.sec }}
<p>{{ len $pages }} manual pages.</p>
{{ range $pages.GroupByParam "letter" }}
<h2 id="{{ .Key }}">{{ .Key }}</h2>
<ul class="man-cols">
{{ range .Pages }}<li><a href="{{ .RelPermalink }}">{{ .Params.name }}</a></li>
{{ end }}</ul>
{{ end }}
{{ end }}
