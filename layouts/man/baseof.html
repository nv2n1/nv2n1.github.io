<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .Title }}{{ .Title }} · {{ end }}Linux Manual Pages</title>
{{ with .Description }}<meta name="description" content="{{ . }}">
{{ end }}<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:site_name" content="SysTutorials">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ if .Title }}{{ .Title }} · {{ end }}Linux Manual Pages">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}Online Linux manual pages: user commands, system calls, library functions, file formats, and administration commands.{{ end }}">
<meta property="og:image" content="{{ "/logo.png" | absURL }}">
<link rel="stylesheet" href="/docs/linux/man/man.css?v=8">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5988258742963952"
     crossorigin="anonymous"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZEXV9L9E6P"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-ZEXV9L9E6P');
</script>
</head>
<body>
<main>
<header class="site">
<a class="site-name" href="/">SysTutorials</a>
<nav><a href="/docs/linux/man/">Linux Manual Pages</a><a href="/privacy-policy/">Privacy</a></nav>
</header>
{{ block "main" . }}{{ end }}
<hr>
    {{ partial "footer.html" . }}
</main>
  <!-- Clean up gsc.tab parameter from URL if present (Google CSE fallback) -->
  <script>
  (function () {
    var url = window.location.href;
    var cleaned = url.replace(/[?&]gsc\.tab=\d+/, '').replace(/#gsc\.tab=\d+/, '');
    if (cleaned !== url) {
      window.history.replaceState({}, document.title, cleaned);
    }
  })();
  </script>
</body>
</html>
