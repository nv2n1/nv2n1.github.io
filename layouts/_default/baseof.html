<!DOCTYPE html>
{{ define "pageTitle" }}{{ if .Title }}{{ .Title }}{{ else }}{{ .Site.Title }}{{ end }}{{ end }}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ template "pageTitle" . }}</title>
  {{ with .Params.canonical }}<link rel="canonical" href="{{ . | absURL }}">{{ else }}<link rel="canonical" href="{{ .Permalink }}">{{ end }}
  <meta name="description" content="{{ .Params.description | default .Site.Params.description }}">
  <meta property="og:site_name" content="{{ .Site.Title }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ template "pageTitle" . }}">
  <meta property="og:url" content="{{ with .Params.canonical }}{{ . | absURL }}{{ else }}{{ .Permalink }}{{ end }}">
  <meta property="og:description" content="{{ .Params.description | default .Site.Params.description }}">
  <meta property="og:image" content="{{ "/logo.png" | absURL }}">
  <style>
    :root {
      color-scheme: light;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fff;
      color: #333;
      line-height: 1.7;
      padding: 1.5rem 1rem 3rem;
    }
    main {
      max-width: 60rem;
      margin: 0 auto;
    }
    header.site {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      row-gap: 0.5rem;
      border-bottom: 1px solid #ddd;
      padding-bottom: 0.8rem;
      margin-bottom: 2rem;
    }
    header.site .site-name {
      font-weight: 700;
      font-size: 1.2rem;
      color: inherit;
      text-decoration: none;
    }
    header.site nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1.2rem;
      justify-content: flex-end;
    }
    header.site nav a {
      margin-left: 0;
    }
    h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      margin-bottom: 1rem;
    }
    h2 {
      font-size: 1.4rem;
      margin: 2.2rem 0 0.6rem;
    }
    h3 {
      font-size: 1.15rem;
      margin: 1.8rem 0 0.5rem;
    }
    p {
      margin-bottom: 1rem;
      color: #555;
    }
    a {
      color: #0a58ca;
    }
    .academies {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
      gap: 1rem;
      margin: 1.5rem 0 2rem;
    }
    .academy {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.1rem 1.2rem;
      background: #fff;
    }
    .academy h3 {
      margin: 0 0 0.5rem;
      font-size: 1.05rem;
    }
    .academy p {
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }
    .academy .paths {
      color: #777;
      font-size: 0.9rem;
    }
    .academy .explore {
      margin-bottom: 0;
    }
    ul, ol {
      padding-left: 1.5rem;
    }
    ul.posts {
      list-style: none;
      padding-left: 0;
    }
    .recent-post {
      margin-bottom: 1.2rem;
    }
    .recent-post h3 {
      margin: 0 0 0.2rem;
      font-size: 1.05rem;
    }
    .recent-post .meta {
      margin: 0;
      color: #888;
      font-size: 0.9rem;
    }
    ul.cat-grid {
      list-style: none;
      padding-left: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
      gap: 0.4rem 1.5rem;
    }
    ul.cat-grid span {
      color: #888;
      font-size: 0.9rem;
    }
    .year-strip a {
      margin-right: 0.9rem;
      white-space: nowrap;
    }
    code, pre {
      font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
    }
    :not(pre) > code {
      background: #0000000f;
      padding: 0.15em 0.35em;
      border-radius: 4px;
    }
    pre {
      background: #ececec;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 1rem;
    }
    ul.posts li {
      margin-bottom: 0.45rem;
    }
    ul.posts time {
      color: #888;
      font-size: 0.9rem;
      display: inline-block;
      min-width: 5.5rem;
    }
    footer.site {
      border-top: 1px solid #ddd;
      margin-top: 3rem;
      padding-top: 1rem;
      color: #888;
      font-size: 0.9rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }
    footer.site a {
      margin-left: 0;
    }
    .footer-msg {
      margin-left: auto;
    }
    header.post-header {
      border-bottom: 1px solid #ddd;
      padding-bottom: 1.2rem;
      margin-bottom: 2rem;
    }
    .post-date, .post-author, .post-updated {
      color: #888;
      font-size: 0.95rem;
    }
    nav.crumbs {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 1.6rem;
    }
    .ad-above-fold {
      width: 300px;
      margin-top: 5px;
      margin-bottom: 50px;
    }
    @media (min-width: 801px) {
      .ad-above-fold {
        float: right;
        margin-left: 50px;
      }
    }
    @media (max-width: 800px) {
      .ad-above-fold {
        margin-left: auto;
        margin-right: auto;
        margin-top: 15px;
        margin-bottom: 25px;
      }
    }
    .ad-after-content {
      clear: both;
      margin-top: 2rem;
    }
    .back {
      display: inline-block;
      margin-top: 3rem;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    table {
      border-collapse: collapse;
      margin-bottom: 1rem;
      display: block;
      max-width: 100%;
      overflow-x: auto;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 0.4rem 0.7rem;
      text-align: left;
    }
    blockquote {
      border-left: 4px solid #ccc;
      padding-left: 1rem;
      color: #666;
      margin-bottom: 1rem;
    }
    .gcse-search-wrapper {
      margin: 1.5rem 0 2rem;
    }
    .gcse-subtitle {
      margin: 0 0 0.5rem;
      color: #555;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .gcse-search-wrapper .gsc-control-cse {
      margin-left: 0 !important;
    }
    .gcse-search-wrapper .gsc-control-cse .gsc-table-result {
      margin-left: 0 !important;
    }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5988258742963952"
       crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZEXV9L9E6P"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZEXV9L9E6P');
  </script>
</head>
<body>
  <main>
    <header class="site">
      <a class="site-name" href="/">SysTutorials</a>
      <nav>
        <a href="/#posts">Recent</a>
        <a href="/archive/">Archive</a><a href="/docs/linux/man/">Linux Manual Pages</a>
      </nav>
    </header>
    {{ block "main" . }}{{ end }}
    {{ partial "footer.html" . }}
  </main>
  <!-- Clean up gsc.tab parameter from URL if present (Google CSE fallback) -->
  <script>
  (function () {
    var url = window.location.href;
    var cleaned = url.replace(/[?&]gsc\.tab=\d+/, '').replace(/#gsc\.tab=\d+/, '');
    if (cleaned !== url) {
      window.history.replaceState({}, document.title, cleaned);
    }
  })();
  </script>

  <!-- Email obfuscation: assemble the address with JS so scrapers
       never see it in the raw HTML source -->
  <script>
  (function () {
    var addr = ['con', 'tact', '@', 'systut', 'orials', '.', 'com'].join('');
    document.querySelectorAll('.email-contact').forEach(function (el) {
      var a = document.createElement('a');
      a.href = 'mai' + 'lto:' + addr;
      a.textContent = addr;
      el.appendChild(a);
    });
  })();
  </script>
</body>
</html>
