<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url={{ .Params.redirect_to }}">
  <link rel="canonical" href="{{ .Params.redirect_to | absURL }}">
  <title>{{ .Title }} - {{ .Site.Title }}</title>
</head>
<body>
  <p>This page has moved to <a href="{{ .Params.redirect_to }}">{{ .Title }}</a>.</p>
</body>
</html>
