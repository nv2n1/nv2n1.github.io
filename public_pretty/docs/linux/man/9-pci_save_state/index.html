<h1>pci_save_state(9)</h1>

<h2>Synopsis</h2>
<pre><code>int pci_save_state(struct pci_dev *dev);</code></pre>
<h2>Arguments</h2>
<p><i>dev</i></p>
<dl><dd>- PCI device that we're dealing with</dd></dl>
