<h1>sdl_getkeyname(3)</h1>





<p>SDL_GetKeyName &#8211; Get the name of an SDL virtual keysym</p>
<h2>Synopsis</h2>
<p><code>#include &quot;SDL.h&quot; </p>
<p> char *SDL_GetKeyName</code>(<code>SDLKey key</code>);</p>
<h2>Description</h2>
<p>Returns the SDL-defined name of the <i></i><code>SDLKey</code> <code>key</code>.</p>
<h2>See Also</h2>
<p><i></i><code>SDLKey</code></p>
