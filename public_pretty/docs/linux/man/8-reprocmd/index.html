<h1>reprocmd(8)</h1>





<p>reprocmd &#8211; control the repro SIP proxy server</p>
<h2>Synopsis</h2>
<p><code>reprocmd [OPTIONS&#8230;]</code> </p>
<h2>Description</h2>
<p><code>reprocmd</code> controls the <code>repro</code> SIP proxy server. </p>
<h2>See Also</h2>
<p>Repro web site at <code><a rel="nofollow" href="http://www.resiprocate.org/About_Repro">http://www.resiprocate.org/About_Repro</a></code> </p>
