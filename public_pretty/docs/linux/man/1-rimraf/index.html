<h1>rimraf(1)</h1>





<h2 class="name">NAME</h2>
<p> <code>rimraf</code> &#8211; Fast deep deletion (like rm -rf) </p>
<h2>SYNOPSIS</h2>
<p> rimraf &lt;path&gt;</p>
<h2>DESCRIPTION</h2>
<p> rimraf is fast deep deletion utility, much like <code>rm -rf</code>, just faster.</p>
