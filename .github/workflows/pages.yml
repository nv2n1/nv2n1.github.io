name: Build and deploy site

# Builds the Hugo site (blog at the root plus the Linux man pages under
# /docs/linux/man/) and deploys it to GitHub Pages.
# Requires repo Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site with Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
      # Tag man pages short/long by body word count; the man single layout
      # skips the ad unit on short pages. Data file is generated, not committed.
      - run: python3 scripts/gen-man-page-length.py man-src data
      # Tag blog posts short/long by body word count; the posts single layout
      # skips the ad-after-content on short pages. Data file is generated, not committed.
      - run: python3 scripts/gen-post-page-length.py content/posts data
      - run: hugo --minify
      # Chunked sitemap index for the ~56k man pages (over the 50k single-file limit)
      - run: python3 scripts/gen-man-sitemap.py public/docs public/docs
      # Pages serves the Actions artifact without Jekyll processing, so this
      # is only a guard in case the Pages source ever flips to a branch.
      - run: touch public/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
