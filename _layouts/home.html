<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.7;
      padding: 2.5rem 1rem 4rem;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #1a1a1a;
        color: #ddd;
      }
    }
    main {
      max-width: 46rem;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      margin-bottom: 1rem;
    }
    h2 {
      font-size: 1.4rem;
      margin: 2.2rem 0 0.6rem;
    }
    p {
      margin-bottom: 1rem;
      color: #666;
    }
    @media (prefers-color-scheme: dark) {
      p {
        color: #aaa;
      }
    }
    ul.posts {
      list-style: none;
    }
    ul.posts li {
      margin-bottom: 0.45rem;
    }
    ul.posts time {
      color: #888;
      font-size: 0.9rem;
      display: inline-block;
      min-width: 5.5rem;
    }
    a {
      color: #0a58ca;
    }
    @media (prefers-color-scheme: dark) {
      a {
        color: #6ea8fe;
      }
    }
  </style>
</head>
<body>
  <main>
    {{ content }}
  </main>
  <!-- Email obfuscation: assemble the address with JS so scrapers
       never see it in the raw HTML source -->
  <script>
  (function () {
    var addr = ['con', 'tact', '@', 'systut', 'orials', '.', 'com'].join('');
    document.querySelectorAll('.email-contact').forEach(function (el) {
      var a = document.createElement('a');
      a.href = 'mai' + 'lto:' + addr;
      a.textContent = addr;
      el.appendChild(a);
    });
  })();
  </script>
  <!-- Default Statcounter code for SysTutorials
  https://www.systutorials.com/ -->
  <script type="text/javascript">
  var sc_project=8983792;
  var sc_invisible=1;
  var sc_security="a0aea12d";
  </script>
  <script type="text/javascript"
  src="https://www.statcounter.com/counter/counter.js"
  async></script>
  <noscript><div class="statcounter"><a title="Web Analytics"
  href="https://statcounter.com/" target="_blank"><img
  class="statcounter"
  src="https://c.statcounter.com/8983792/0/a0aea12d/1/"
  alt="Web Analytics"
  referrerPolicy="no-referrer-when-downgrade"></a></div></noscript>
  <!-- End of Statcounter Code -->
</body>
</html>
