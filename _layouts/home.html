<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.7;
      padding: 1.5rem 1rem 3rem;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #1a1a1a;
        color: #ddd;
      }
    }
    main {
      max-width: 60rem;
      margin: 0 auto;
    }
    header.site {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      padding-bottom: 0.8rem;
      margin-bottom: 2rem;
    }
    @media (prefers-color-scheme: dark) {
      header.site {
        border-color: #333;
      }
    }
    header.site .site-name {
      font-weight: 700;
      font-size: 1.2rem;
      color: inherit;
      text-decoration: none;
    }
    header.site nav a {
      margin-left: 1.2rem;
    }
    h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      margin-bottom: 1rem;
    }
    h2 {
      font-size: 1.4rem;
      margin: 2.2rem 0 0.6rem;
    }
    p {
      margin-bottom: 1rem;
      color: #555;
    }
    @media (prefers-color-scheme: dark) {
      p {
        color: #bbb;
      }
    }
    a {
      color: #0a58ca;
    }
    @media (prefers-color-scheme: dark) {
      a {
        color: #6ea8fe;
      }
    }
    .academies {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
      gap: 1rem;
      margin: 1.5rem 0 2rem;
    }
    .academy {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.1rem 1.2rem;
      background: #fff;
    }
    @media (prefers-color-scheme: dark) {
      .academy {
        border-color: #333;
        background: #222;
      }
    }
    .academy h3 {
      margin: 0 0 0.5rem;
      font-size: 1.05rem;
    }
    .academy p {
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }
    .academy .paths {
      color: #777;
      font-size: 0.9rem;
    }
    .academy .explore {
      margin-bottom: 0;
    }
    ul.posts {
      list-style: none;
    }
    code, pre {
      font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
    }
    :not(pre) > code {
      background: #0000000f;
      padding: 0.15em 0.35em;
      border-radius: 4px;
    }
    @media (prefers-color-scheme: dark) {
      :not(pre) > code {
        background: #ffffff14;
      }
    }
    pre {
      background: #ececec;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 1rem;
    }
    @media (prefers-color-scheme: dark) {
      pre {
        background: #262626;
      }
    }
    ul.posts li {
      margin-bottom: 0.45rem;
    }
    ul.posts time {
      color: #888;
      font-size: 0.9rem;
      display: inline-block;
      min-width: 5.5rem;
    }
    footer.site {
      border-top: 1px solid #ddd;
      margin-top: 3rem;
      padding-top: 1rem;
      color: #888;
      font-size: 0.9rem;
    }
    @media (prefers-color-scheme: dark) {
      footer.site {
        border-color: #333;
      }
    }
    footer.site a {
      margin-left: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <header class="site">
      <a class="site-name" href="/">SysTutorials</a>
      <nav>
        <a href="/#posts">All Posts</a>
      </nav>
    </header>
    {{ content }}
    <footer class="site">
      Contact: <span class="email-contact"></span><a href="/categories/">Categories</a><a href="/authors/">Authors</a><a href="https://github.com/nv2n1/nv2n1.github.io" target="_blank" rel="noopener">GitHub</a><a href="/linux-manual-pages/">Linux man pages</a>
    </footer>
  </main>
  <!-- Email obfuscation: assemble the address with JS so scrapers
       never see it in the raw HTML source -->
  <script>
  (function () {
    var addr = ['con', 'tact', '@', 'systut', 'orials', '.', 'com'].join('');
    document.querySelectorAll('.email-contact').forEach(function (el) {
      var a = document.createElement('a');
      a.href = 'mai' + 'lto:' + addr;
      a.textContent = addr;
      el.appendChild(a);
    });
  })();
  </script>
  <!-- Default Statcounter code for SysTutorials
  https://www.systutorials.com/ -->
  <script type="text/javascript">
  var sc_project=8983792;
  var sc_invisible=1;
  var sc_security="a0aea12d";
  </script>
  <script type="text/javascript"
  src="https://www.statcounter.com/counter/counter.js"
  async></script>
  <noscript><div class="statcounter"><a title="Web Analytics"
  href="https://statcounter.com/" target="_blank"><img
  class="statcounter"
  src="https://c.statcounter.com/8983792/0/a0aea12d/1/"
  alt="Web Analytics"
  referrerPolicy="no-referrer-when-downgrade"></a></div></noscript>
  <!-- End of Statcounter Code -->
</body>
</html>
