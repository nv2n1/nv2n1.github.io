<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SysTutorials is Deprecated</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      color: #333;
      padding: 1rem;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #1a1a1a;
        color: #eee;
      }
    }
    main {
      max-width: 40rem;
      text-align: center;
    }
    h1 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      margin-bottom: 1rem;
    }
    .badge {
      display: inline-block;
      background: #b00020;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 1rem;
      color: #666;
    }
    @media (prefers-color-scheme: dark) {
      p {
        color: #aaa;
      }
    }
    footer {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: #999;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Deprecated</span>
    <h1>SysTutorials is deprecated</h1>
    <p>SysTutorials is no longer maintained and has been deprecated.</p>
    <p>Please refer to official documentation for up-to-date system tutorials and information.</p>
    <footer>Last updated: November 2026</footer>
  </main>
</body>
</html>
